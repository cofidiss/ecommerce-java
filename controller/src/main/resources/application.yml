spring:
  redis:
    host: localhost
    port: 6379
  aop:
    auto: true
    proxy-target-class: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: postgres
    password: ""
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

security:
  jwt:
    secret: 1234567890
    expirationTime: 1800000

server:
  port: 5173