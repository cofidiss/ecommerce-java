version: "3.9"

services:
  postgres:
    image: ecommerce-db
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ZAQ12wsx
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"

  redis:
    image: ecommerce-redis
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: ecommerce-rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  spring:
    image: ecommerce-spring
    container_name: spring
    depends_on:
      - postgres
      - redis
      - rabbitmq
    ports:
      - "5173:5173"
    environment:      
        SPRING_PROFILES_ACTIVE: docker